<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just Do Eat · Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- SheetJS for Excel Export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0EA5E9;--primary-dark:#0284C7;--accent:#F59E0B;
  --bg:#F8FAFC;--card-bg:#FFFFFF;--text:#0F172A;--muted:#64748B;
  --border:#E2E8F0;--radius:20px;--shadow:0 10px 25px -5px rgba(15,23,42,0.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
h1{margin:0;font-size:24px}
.actions{display:flex;gap:10px}
button{cursor:pointer;font:inherit}
.btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(14,165,233,0.3);transition:.2s}
.btn:hover{background:var(--primary-dark)}
.btn.accent{background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px}
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.status{padding:4px 12px;border-radius:50px;font-size:12px;font-weight:800;background:#E0F2FE;color:var(--primary-dark)}
.receipt{background:#F8FAFC;border:1px dashed var(--border);border-radius:14px;padding:14px;font-size:13px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-weight:800;font-size:15px;border-top:1px solid var(--border);padding-top:8px}
select.field, input.field{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:700}
.empty{text-align:center;padding:50px;color:var(--muted)}

/* Auth Lock Screen */
.lockscreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:32px;width:min(100%,380px);box-shadow:var(--shadow);text-align:center}
</style>
</head>
<body>

<!-- Lock Screen Overlay -->
<div id="lockscreen" class="lockscreen">
  <div class="lockcard">
    <div style="font-size:40px;margin-bottom:12px">🔒</div>
    <h2 style="margin:0 0 6px">Accès Administrateur</h2>
    <p style="font-size:13px;color:var(--muted);margin:0 0 20px">Entrez le code secret pour afficher les commandes.</p>
    <input type="password" id="passcode" class="field" placeholder="Code secret" style="text-align:center;font-size:16px;letter-spacing:2px;margin-bottom:14px">
    <button class="btn full" onclick="checkAuth()" style="width:100%;justify-content:center;padding:12px">Se connecter</button>
    <p id="autherror" style="color:#EF4444;font-size:12px;font-weight:700;margin-top:12px;display:none">Code incorrect !</p>
  </div>
</div>

<div class="container" id="adminContent" style="display:none">
  <header>
    <div>
      <h1>Just Do Eat · Admin Dashboard</h1>
      <span style="font-size:13px;color:var(--muted)">Gestion des commandes en temps réel</span>
    </div>
    <div class="actions">
      <button class="btn accent" onclick="exportExcel()">📊 Exporter vers Excel</button>
      <button class="btn" onclick="loadOrders()">🔄 Actualiser</button>
      <button class="btn" onclick="logout()" style="background:#EF4444;box-shadow:none">Déconnexion</button>
    </div>
  </header>

  <div id="ordersContainer" class="grid">
    <div class="empty">Chargement des commandes...</div>
  </div>
</div>

<script>
// Hash for 'tajinedl7ot'
const ADMIN_HASH = "152010c794caed0fb44d71bc8cb3aeb00cbfa7e7ea5199615a6b09335ef0dd82";

const APPWRITE = {
  endpoint: 'https://fra.cloud.appwrite.io/v1',
  project: '6ad3bbf5001b729738c7',     
  database: '6ad3bc4600163851b006',   
  collection: '6ad3bcdf001ebfbb1714'            
};

let allOrders = [];

// Lightweight, standalone SHA-256 implementation (works everywhere)
function sha256Sync(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j, result = '';
  var words = [], asciiBitLength = ascii[lengthProperty] * 8;
  var hash = [], k = [], isPrime = function(n) {
    for (var factor = 2; factor <= Math.sqrt(n); factor++) if (n % factor === 0) return false;
    return true;
  };
  var candidate = 2;
  while (hash[lengthProperty] < 8) {
    if (isPrime(candidate)) {
      hash.push((mathPow(candidate, 1/2) * maxWord) | 0);
      k.push((mathPow(candidate, 1/3) * maxWord) | 0);
    }
    candidate++;
  }
  ascii += '\x80';
  while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i % 4) * 8);
  }
  words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
  words[words[lengthProperty]] = asciiBitLength;
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j >= 0; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? '0' : '') + b.toString(16);
    }
  }
  return result;
}

function checkAuth(){
  const input = document.getElementById('passcode').value.trim();
  const inputHash = sha256Sync(input);
  
  if(inputHash === ADMIN_HASH || sessionStorage.getItem('admin_authed') === 'true'){
    sessionStorage.setItem('admin_authed', 'true');
    document.getElementById('lockscreen').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    document.getElementById('autherror').style.display = 'none';
    loadOrders();
  } else {
    document.getElementById('autherror').style.display = 'block';
  }
}

function logout(){
  sessionStorage.removeItem('admin_authed');
  location.reload();
}

document.getElementById('passcode').addEventListener('keyup', function(e){
  if(e.key === 'Enter') checkAuth();
});

if(sessionStorage.getItem('admin_authed') === 'true'){
  checkAuth();
}

async function aw(method, path, body){
  const headers = {'X-Appwrite-Project': APPWRITE.project, 'Content-Type': 'application/json'};
  const r = await fetch(APPWRITE.endpoint + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 204) return {};
  const j = await r.json().catch(function(){return {}});
  if (!r.ok) throw new Error(j.message || ('Erreur ' + r.status));
  return j;
}

async function loadOrders(){
  const container = document.getElementById('ordersContainer');
  container.innerHTML = '<div class="empty">Chargement...</div>';
  try {
    const res = await aw('GET', '/databases/' + APPWRITE.database + '/collections/' + APPWRITE.collection + '/documents');
    allOrders = res.documents || [];
    renderOrders();
  } catch(e) {
    container.innerHTML = '<div class="empty" style="color:red">Erreur : ' + e.message + '</div>';
  }
}

async function updateStatus(docId, newStatus){
  try {
    await aw('PATCH', '/databases/' + APPWRITE.database + '/collections/' + APPWRITE.collection + '/documents/' + docId, {
      data: { status: newStatus }
    });
    loadOrders();
  } catch(e) {
    alert('Erreur lors de la mise à jour : ' + e.message);
  }
}

function renderOrders(){
  const container = document.getElementById('ordersContainer');
  if(!allOrders.length){
    container.innerHTML = '<div class="empty">Aucune commande trouvée.</div>';
    return;
  }

  container.innerHTML = allOrders.map(function(doc){
    let itemsParsed = [];
    try { itemsParsed = JSON.parse(doc.items || '[]'); } catch(err){}
    
    return '<div class="panel">' +
      '<div class="row"><b>#' + (doc.oid || doc.$id.slice(0,6)) + '</b><span class="status">' + doc.status + '</span></div>' +
      '<div>Client : <b>' + doc.name + '</b><br>Tél : <b>' + doc.phone + '</b><br>Créneau : <b>' + (doc.slot || 'N/A') + '</b><br>Code : <b style="color:var(--primary);font-size:16px">' + doc.code + '</b></div>' +
      '<div class="receipt">' +
        itemsParsed.map(function(i){
          const extrasStr = i.extras && i.extras.length ? ' (' + i.extras.map(e=>e.name).join(', ') + ')' : '';
          return '<div style="display:flex;justify-content:space-between"><span>' + i.qty + 'x ' + i.id + extrasStr + '</span><b>' + (i.unit * i.qty) + ' DH</b></div>';
        }).join('') +
        '<div class="total"><span>Total</span><span>' + doc.total + ' DH</span></div>' +
      '</div>' +
      '<div><label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px">Changer le statut :</label>' +
      '<select class="field" onchange="updateStatus(\'' + doc.$id + '\', this.value)">' +
        ['Reçue', 'En préparation', 'Prête', 'Récupérée'].map(s => '<option value="' + s + '" ' + (doc.status === s ? 'selected' : '') + '>' + s + '</option>').join('') +
      '</select></div>' +
    '</div>';
  }).join('');
}

function exportExcel(){
  if(!allOrders.length){ alert('Aucune donnée à exporter'); return; }
  
  let flatRows = [];
  allOrders.forEach(doc => {
    let items = [];
    try { items = JSON.parse(doc.items || '[]'); } catch(e){}
    items.forEach(i => {
      flatRows.push({
        "ID Commande": doc.oid || doc.$id,
        "Code Retrait": doc.code,
        "Client": doc.name,
        "Téléphone": doc.phone,
        "Plat ID": i.id,
        "Quantité": i.qty,
        "Extras": i.extras ? i.extras.map(e => e.name).join(', ') : '',
        "Prix Unitaire (DH)": i.unit,
        "Total Ligne (DH)": i.unit * i.qty,
        "Créneau": doc.slot,
        "Statut": doc.status,
        "Date": new Date(doc.$createdAt).toLocaleString('fr-FR')
      });
    });
  });

  const worksheet = XLSX.utils.json_to_sheet(flatRows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Commandes");
  XLSX.writeFile(workbook, "JustDoEat_Commandes.xlsx");
}
</script>
</body>
</html>
